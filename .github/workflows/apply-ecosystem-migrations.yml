name: Apply ecosystem migrations (0043–0048)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: vhqwitbrpqaiutjbundo
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase db push --db-url "$SUPABASE_DB_URL"
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN present but SUPABASE_DB_URL missing."
            echo "Add GitHub secret SUPABASE_DB_URL (postgres connection string) and re-run."
            exit 1
          else
            echo "Missing SUPABASE_DB_URL / SUPABASE_ACCESS_TOKEN secrets."
            exit 1
          fi
