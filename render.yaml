# Production static site for kutekalink.com (Cloudflare → Render).
# Builds the KEOS Next.js Landing as a static export into ./dist.
services:
  - type: web
    name: kutekalink
    runtime: static
    repo: https://github.com/EduardoZ121/Site_Angola
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_PUBLIC_APP_URL
        value: https://kutekalink.com
      - key: NEXT_PUBLIC_ENABLE_DEV_TOOLS
        value: 'false'
    domains:
      - kutekalink.com
      - www.kutekalink.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
